name: Release

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions: {}

jobs:
    # ──────────────────────────────────────────────────────────
    # Step 1: Release Please - creates/updates release PRs
    # ──────────────────────────────────────────────────────────
    release-please:
        name: Release Please
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        outputs:
            js_released: ${{ steps.release.outputs['packages/js--release_created'] }}
            js_tag: ${{ steps.release.outputs['packages/js--tag_name'] }}
            js_version: ${{ steps.release.outputs['packages/js--version'] }}

        steps:
            - name: Run Release Please
              id: release
              uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

    # ──────────────────────────────────────────────────────────
    # Step 2: Publish JS to npm
    # ──────────────────────────────────────────────────────────
    publish-npm:
        name: Publish to npm
        permissions:
            contents: read
            id-token: write
        needs: [release-please]
        if: needs.release-please.outputs.js_released == 'true'
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: packages/js

        steps:
            - name: Checkout the JS release tag
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ needs.release-please.outputs.js_tag }}
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
              with:
                  node-version: 24
                  registry-url: 'https://registry.npmjs.org'

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Build
              run: npm run build

            - name: Publish
              run: npm publish --access public --provenance
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
