version: 2

updates:
    # PHP / Composer dependencies
    - package-ecosystem: 'composer'
      directory: '/packages/php'
      schedule:
          interval: 'weekly'
          day: 'monday'
      commit-message:
          prefix: 'chore(php)'
      reviewers:
          - 'felipesauer'
      groups:
          dev-dependencies:
              dependency-type: 'development'
              update-types:
                  - 'minor'
                  - 'patch'
          production-dependencies:
              dependency-type: 'production'

    # All npm deps (root tooling + packages/js workspace — single shared lockfile)
    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'weekly'
          day: 'monday'
      commit-message:
          prefix: 'chore(deps)'
      reviewers:
          - 'felipesauer'
      groups:
          # vitest and @vitest/* must move together: @vitest/coverage-v8 pins the exact vitest
          # version as a peer, so a PR for only one of them can never install or pass.
          vitest:
              patterns:
                  - 'vitest'
                  - '@vitest/*'
          npm:
              dependency-type: 'development'
              exclude-patterns:
                  - 'vitest'
                  - '@vitest/*'
              update-types:
                  - 'minor'
                  - 'patch'
      ignore:
          # vitepress-plugin-mermaid only accepts mermaid 10 or 11 as a peer, so a
          # mermaid 12 PR can never install. Revisit once the plugin widens its range.
          - dependency-name: 'mermaid'
            update-types: ['version-update:semver-major']
          # vitest 5 breaks @stryker-mutator/vitest-runner: its per-test filter matches nothing, so
          # every covered mutant survives and the mutation score collapses. Upstream bug:
          # https://github.com/stryker-mutator/stryker-js/issues/6210
          # Drop these two entries once a vitest-runner release fixes it.
          - dependency-name: 'vitest'
            update-types: ['version-update:semver-major']
          - dependency-name: '@vitest/*'
            update-types: ['version-update:semver-major']

    # GitHub Actions
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'weekly'
          day: 'monday'
      commit-message:
          prefix: 'chore(ci)'
      reviewers:
          - 'felipesauer'
